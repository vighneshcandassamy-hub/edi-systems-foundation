[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "edi-systems-foundation"
version = "0.9.1.dev0"
description = "Owner-isolated EDI components with bounded durable integrated workflows"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
numerical = ["scipy==1.17.0", "numpy==2.5.3"]

[project.scripts]
edi = "edi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
