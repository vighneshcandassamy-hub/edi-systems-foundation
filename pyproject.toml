[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "edi-systems-foundation"
version = "0.4.0"
description = "Owner-isolated EDI observation, attributed interpretation and versioned world hosting"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
edi = "edi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
